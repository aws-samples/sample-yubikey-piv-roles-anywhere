# Gitleaks configuration
# Extend the built-in detector set, then allow only exact public AWS
# documentation fixture values. Source and test files remain fully scanned.

[extend]
useDefault = true

[[allowlists]]
description = "AWS documentation example credentials"
regexTarget = "match"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''ASIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]

[[allowlists]]
description = "Gitleaks fingerprint file self-reference"
paths = [
  '''^\.gitleaksignore$''',
]

[[allowlists]]
description = "Generated Rust build artifacts"
paths = [
  '''(^|/)rust/target/''',
]
