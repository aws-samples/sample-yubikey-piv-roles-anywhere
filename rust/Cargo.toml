[package]
name = "yubira"
version = "0.1.0"
edition = "2021"
description = "YubiKey IAM Roles Anywhere credential process"
license = "MIT-0"

[[bin]]
name = "yubira"
path = "src/main.rs"

[dependencies]
# YubiKey PIV operations
# Stable APIs used by Yubira do not require the crate's broad `untested` feature.
yubikey = "0.8"

# Cryptography
x509-cert = { version = "0.2", features = ["pem"] }
der = { version = "0.7", features = ["alloc"] }
pkcs1 = "=0.7.5"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# HTTP client (blocking, minimal)
ureq = { version = "2", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "=1.8.2", features = ["derive"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# URL encoding
percent-encoding = "2"

# Big integer for certificate serial numbers
num-bigint-dig = "0.8"

# Secure PIN input
rpassword = "7.5"

[dev-dependencies]
proptest = "1"
